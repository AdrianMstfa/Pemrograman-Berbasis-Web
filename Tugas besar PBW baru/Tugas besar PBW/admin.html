<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style admin.css">
    <title>Dashboard Admin</title>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <img src="admin.png" alt="admin" class="profil-pic">
            <ul>
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="projek.html">Windspeed</a></li>
                <li><a href="login.html">Keluar</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <header>
                <h1>Dashboard Admin</h1>
            </header>
            <section class="form-section">
                <h2>Kelola Pengguna</h2>
                <form id="userForm">
                    <input type="text" id="fullname" placeholder="Nama Lengkap" required>
                    <input type="email" id="gmail" placeholder="Email" required>
                    <input type="text" id="username" placeholder="username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" id="saveButton">Simpan</button>
                    <button type="button" id="clearButton" onclick="clearForm()">Batal</button>
                </form>
            </section>
            <section class="table-section">
                <h2>Daftar Pengguna</h2>
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>Nama Pengguna</th>
                            <th>Email</th>
                            <th>username</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script admin.js"></script>
</body>
</html>
