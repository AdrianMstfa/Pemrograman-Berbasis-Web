<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylebaru1.css">
    <title>Halaman Login</title>
</head>
<body>
    <div class="container">
        <img src="windspeed.jpeg" alt="Profile Picture" class="profil-pic">

        <h2>Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
            <label for="gmail">Gmail:</label>
            <input type="email" id="gmail" required>
            <label for="password">Password:</label>
            <input type="password" id="password" required>
            <button type="submit">Login</button>
        </form>
        <p><a href="register.html">Daftar Akun</a></p>
    </div>

    <script src="scriptbaru1.js"></script>
</body>
</html>
